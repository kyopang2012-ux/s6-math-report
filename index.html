    const r0 = a.recs[0], r1 = a.recs[a.k-1], one = a.k<2;
    const e = ends(a), b0 = e ? e[0] : r0, b1 = e ? e[1] : r1, cmp = !!e;
    const only = a.switched && e ? `（只計 ${GRPN(r1.set)}）` : '';
    const kc = [
      `<div class="pg-kc"><span class="pg-kl">標準分（相對同組）</span><b>${cmp ? `${sgn(b0.zs)} → ${sgn(b1.zs)}` : sgn(r1.zs)}</b><em>${a.basis==='z' ? `走勢 ${sgn(a.T)}${only}` : one ? zDesc(r1.zs) : '轉組，按估計等級判斷'}</em></div>`,
      `<div class="pg-kc"><span class="pg-kl">估計 DSE 等級</span><b>${lvMove(a)}</b><em>${one ? QS[r1.q] : a.L==null ? '—' : a.L>0 ? `上升 ${a.L} 級` : a.L<0 ? `下降 ${Math.abs(a.L)} 級` : '沒有改變'}</em></div>`,
      `<div class="pg-kc"><span class="pg-kl">組內排名</span><b>${cmp ? `${rankTxt(b0)} → ${rankTxt(b1)}` : rankTxt(r1)}</b><em>${cmp ? `${topPct(b0)} → ${topPct(b1)}${only}` : topPct(r1) + (one ? '' : '（轉組，不作比較）')}</em></div>`,
      `<div class="pg-kc"><span class="pg-kl">與同組平均差距</span><b>${cmp ? `${pp(b0.gap)} → ${pp(b1.gap)}` : pp(r1.gap)}</b><em>百分點（得分率）${only}</em></div>`
    ].join('');
    const qrows = a.recs.map((r,j) => {
      const pr = a.recs[j-1];
      const d = !pr ? '<span class="na">—</span>' : pr.set!==r.set ? '<span class="delta eq">轉組</span>' : pr.zs!=null && r.zs!=null ? dzTag(r2(r.zs-pr.zs)) : '<span class="na">—</span>';
      return `<tr><th>${circ(r.q)} ${esc(QS[r.q])}<span class="unit">${esc(QP[r.q]||'')}</span></th><td class="c">${gtag(r.set)}</td>
        <td class="c"><b>${r.z.total}</b><small>/${r.z.max}</small></td>
        <td class="eb">${ebar(r.rate, r.grate, '同組平均')}<em>${pc(r.rate)}%</em><small>同組平均 ${r.grate==null?'—':pc(r.grate)+'%'}</small></td>
        <td class="c">${ppTag(r.gap)}</td><td class="c"><b>${sgn(r.zs)}</b></td><td class="c">${d}</td>
        <td class="c">${rankTxt(r)}<small>${topPct(r)}</small></td><td class="c">${lvTag(r.lv)}</td></tr>`;
    }).join('');
    const srows = a.secs.map(x => `<tr><th>${SECN[x.s]}</th>${a.recs.map(r => {
        const v = x.rs.find(o => o.q===r.q);
        return v ? `<td class="sc"><b>${v.g}</b><small class="of">/${v.m}</small><small>${pc(v.rate)}%（組 ${v.grate==null?'—':pc(v.grate)+'%'}）</small><small class="pg-zs">${sgn(v.zs)} SD</small></td>` : '<td class="sc na">本卷不設</td>';
      }).join('')}<td class="c">${x.T==null ? '<span class="na">—</span>' : `<b>${sgn(x.T)}</b>`}</td><td>${x.v ? vtag(x.v) : '<span class="na">記錄不足</span>'}</td></tr>`).join('');
    const tItem = t => `<div class="pg-ti"><b>${esc(t.name)}</b><span class="pg-seq">${t.ap.map(x => `<span class="pg-chip ${bin(x.rate)}" title="${esc(QS[x.q] + '　' + x.dse.join('、'))}">${circ(x.q)} ${x.g}/${x.m}</span>`).join('<i>→</i>')}</span></div>`;
    const tBlock = (title, list, col, emptyTxt) => `<div class="pg-tb" style="--c:${col}"><h6>${title}<em>${list.length} 項</em></h6>${list.length ? list.slice(0,8).map(tItem).join('') + (list.length>8 ? `<p class="pg-more">另有 ${list.length-8} 項：${list.slice(8).map(t => esc(t.name)).join('、')}</p>` : '') : `<p class="pg-more">${emptyTxt}</p>`}</div>`;
    const repeated = a.topics.filter(t => t.ap.length>=2).length;
    $('pgPanel').innerHTML = `
      <div class="pg-head"><h4>${esc(a.p.name)}</h4><span class="sub">學號 ${esc((a.p.nos||[a.p.no]).join(' / '))}</span>${a.sets.map(gtag).join('')}${vtag(a.v)}${flags(a)}</div>
      <p class="pg-story">${story(a)}</p>
      <div class="pg-kcards">${kc}</div>
      <div class="pg-charts">
        <div><h5 class="pg-h5">各卷標準分（相對位置）<em>判斷進步的主要依據；灰色帶＝持平區</em></h5><div class="scroll">${chartZ(a)}</div></div>
        <div><h5 class="pg-h5">各卷得分率與同組平均<em>原始得分率受試卷難易影響，只作參考</em></h5><div class="scroll">${chartRate(a)}</div></div>
      </div>
      <div class="tsec"><h5>各次測驗<em>能量棒刻度＝同組平均</em></h5>
        <div class="scroll"><table class="tgrid pg-qtab"><thead><tr><th>測驗</th><th class="c">組別</th><th class="c">得分</th><th class="eb">得分率</th><th class="c">與同組平均<span class="unit">百分點</span></th><th class="c">標準分</th><th class="c">較上一卷<span class="unit">標準分</span></th><th class="c">組內排名</th><th class="c">估計等級</th></tr></thead><tbody>${qrows}</tbody></table></div></div>
      ${a.secs.length ? `<div class="tsec"><h5>各 Section 進步情況<em>每格：得分、得分率（同組平均）、標準分</em></h5>
        <div class="scroll"><table class="tgrid pg-stab"><thead><tr><th>分卷</th>${a.recs.map(r => `<th class="sc">${circ(r.q)} ${esc(QS[r.q])}<span class="unit">${esc(QP[r.q]||'')}・${esc(r.set)}</span></th>`).join('')}<th class="c">走勢<span class="unit">標準分</span></th><th>判斷</th></tr></thead><tbody>${srows}</tbody></table></div>
        ${a.switched ? `<p class="caption">曾轉組：Section 走勢只計算 ${GRPN(r1.set)} 的記錄。</p>` : ''}</div>` : ''}
      <div class="tsec"><h5>課題變化<em>只比較出現兩次或以上的課題（共 ${repeated} 個）；①②③…為測驗次序，格內為該次得分</em></h5>
        ${repeated ? `<div class="pg-tblocks">
          ${tBlock('已改善', a.tImp, '#3F8A66', '沒有明顯改善的課題。')}
          ${tBlock('每次都失分', a.tPer, '#B8322A', '沒有每次都失分的課題。')}
          ${tBlock('轉差', a.tDec, '#D9953A', '沒有轉差的課題。')}
        </div>${a.tOk.length ? `<p class="pg-more">另有 ${a.tOk.length} 個課題每次都取得滿分：${a.tOk.map(t => esc(t.name)).join('、')}。</p>` : ''}` : '<p class="none">暫時沒有在兩次或以上測驗出現的課題。</p>'}</div>
      <div class="tsec"><h5>跟進重點</h5><ol class="pg-adv">${advice(a).map(t => `<li>${t}</li>`).join('')}</ol></div>
      <div class="pg-actions"><button type="button" class="pg-link" data-i="${a.i}">在「個別學生分析」查看此學生的課題明細 →</button></div>`;
  }
  function show(i, scroll){
    if(!A[i] || !A[i].k) return;
    cur = i;
    renderBar(); renderPanel();
    app.querySelectorAll('#pgBody tr[data-i]').forEach(tr => tr.classList.toggle('sel', +tr.dataset.i===i));
    app.querySelectorAll('#pgTrend .pg-trow').forEach(g => g.classList.toggle('on', +g.dataset.i===i));
    if(scroll){ const h = $('pgDetail'); if(h) h.scrollIntoView({behavior:'smooth', block:'start'}); }
  }

  /* ---- 事件 ---- */
  ['pgG','pgV','pgS'].forEach(id => $(id).addEventListener('change', renderAll));
  $('pgQ').addEventListener('input', renderAll);
  $('pgR').addEventListener('click', () => { $('pgQ').value=''; $('pgG').value=''; $('pgV').value=''; $('pgS').value='T-desc'; renderAll(); });
  sec.querySelectorAll('.pg-kpi').forEach(b => b.addEventListener('click', () => {
    $('pgV').value = $('pgV').value===b.dataset.v ? '' : b.dataset.v; renderAll();
    const t = $('pgTrend'); if(t) t.scrollIntoView({behavior:'smooth', block:'center'});
  }));
  $('pgBar').addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if(b) show(+b.dataset.i, false); });
  app.addEventListener('click', e => {
    const t = e.target.closest('.pg-nmb, .pg-trow, .pg-jump');
    if(t){ show(+t.dataset.i, true); return; }
    const l = e.target.closest('.pg-link');
    if(l){
      const b = app.querySelector(`#stuBar button[data-i="${l.dataset.i}"]`);
      if(b){ b.click(); const pnl = app.querySelector('#stuPanel'); if(pnl) pnl.scrollIntoView({behavior:'smooth', block:'start'}); }
    }
  });
  app.addEventListener('keydown', e => {
    if(e.key!=='Enter' && e.key!==' ') return;
    const t = e.target.closest && e.target.closest('.pg-trow');
    if(t){ e.preventDefault(); show(+t.dataset.i, true); }
  });

  /* 「個別學生分析」面板頂部的簡短判斷（由 renderPanel 呼叫） */
  window.__progBrief = i => {
    const a = A[i];
    if(!a || !a.k) return '';
    const r0 = a.recs[0], r1 = a.recs[a.k-1];
    let t;
    if(a.k<2) t = `只有 ${esc(QS[r1.q])} 一次卷一記錄，未能判斷。`;
    else {
      const b0 = a.basis==='z' ? a.bRecs[0] : r0, b1 = a.basis==='z' ? a.bRecs[a.bRecs.length-1] : r1;
      t = (a.basis==='z' ? `標準分 ${sgn(b0.zs)} → ${sgn(b1.zs)}，走勢 <b>${sgn(a.T)}</b>` : esc(a.note||''))
        + (r0.lv && r1.lv ? `；估計等級 ${esc(r0.lv)} → ${esc(r1.lv)}` : '');
    }
    return `<div class="pg-brief" style="--c:${VERD[a.v].col}"><span class="pg-bl">卷一進步判斷</span>${vtag(a.v)}${flags(a)}<span class="pg-bt">${t}</span><button type="button" class="pg-jump" data-i="${i}">詳細進步分析 →</button></div>`;
  };

  renderAll();
  renderBar();
  renderPanel();
}

  const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const pw=document.getElementById('pw'), msg=document.getElementById('msg'), go=document.getElementById('go'), eye=document.getElementById('eye');
  eye.addEventListener('click',()=>{const show=pw.type==='password'; pw.type=show?'text':'password'; eye.textContent=show?'隱藏':'顯示'; eye.setAttribute('aria-pressed',String(show)); pw.focus();});
  const hasCrypto = !!(window.crypto && crypto.subtle);

  // Accept full-width characters, stray spaces and surrounding brackets
  function candidates(raw){
    let v=(raw.normalize?raw.normalize('NFKC'):raw).replace(/\s+/g,'');
    const list=[v];
    const inner=v.replace(/^[\[【「『(（]+/,'').replace(/[\]】」』)）]+$/,'');
    if(inner && inner!==v) list.push(inner);
    return list;
  }
  async function tryKey(p){
    const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(DATA.salt),iterations:DATA.iter,hash:'SHA-256'}, base, {name:'AES-GCM',length:256}, false, ['decrypt']);
    return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(DATA.iv)}, key, u8(DATA.ct));
  }
  // 解密後的資料以 gzip 壓縮：優先用瀏覽器內建 DecompressionStream，舊瀏覽器改用內嵌 pako
  async function unpack(buf){
    if(DATA.z!==1) return new TextDecoder().decode(buf);
    if(typeof DecompressionStream==='function'){
      try{
        const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new TextDecoder().decode(await new Response(s).arrayBuffer());
      }catch(e){ console.warn('DecompressionStream 失敗，改用 pako', e); }
    }
    if(window.pako && window.pako.ungzip) return new TextDecoder().decode(window.pako.ungzip(new Uint8Array(buf)));
    throw new Error('瀏覽器不支援解壓縮，請改用最新版 Chrome、Edge 或 Safari');
  }
  async function unlock(){
    if(!hasCrypto){ msg.textContent='這個開啟方式不支援解密。請把檔案下載後，用 Chrome、Safari 或 Edge 直接開啟。'; return; }
    if(typeof initReport !== 'function'){ msg.textContent='報告程式未能載入（initReport 不存在），請用較新版本的瀏覽器開啟。'; return; }

      if(typeof initQ6==='function'){ try{ initQ6(); }catch(e){ console.error('Quiz 6 面板載入失敗', e); } }
      document.getElementById('lockBtn').addEventListener('click',e=>{
        e.preventDefault(); app.innerHTML=''; app.hidden=true;
        document.getElementById('gate').hidden=false; go.disabled=false; go.textContent='解鎖報告'; msg.textContent=''; pw.focus();
      });
      window.scrollTo(0,0);
    }catch(err){
      msg.textContent='密碼正確，但報告載入時出錯：'+(err && err.message ? err.message : err); go.disabled=false; go.textContent='解鎖報告';
      console.error(err);
    }
  }
  go.addEventListener('click', unlock);
  pw.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); unlock(); } });
  try{ pw.focus(); }catch(e){}
})();

<script>
/* 卷二 MC：試卷切換；個別學生面板（按 Group A／B 選擇學生）；各 Section 跨年失分題目篩選及排序 */
function initQ6(){
  const sec = document.getElementById('mc'); if(!sec) return;
  /* 試卷切換（全段同步） */
  const sws = [...sec.querySelectorAll('.mcsw button')];
  const setP = p => {
    sws.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === p)));
    sec.querySelectorAll('.mcpp').forEach(d => { d.hidden = d.dataset.p !== p; });
  };
  sws.forEach(b => b.addEventListener('click', () => setP(b.dataset.p)));
  const btns = [...sec.querySelectorAll('.q6bar button')];
  const pans = [...sec.querySelectorAll('#q6Panels .q6p')];
  const DEF = {y:'', paper:'', show:'', sec:'', q:'', sort:'ord'};
  let st = Object.assign({}, DEF), cur = null;
  const ctl = (pan, k) => pan.querySelector('.q6f [data-f="' + k + '"]');
  const SECG = {sA:['A1','A2','MA'], sB:['B','MB']};
  const put = pan => {
    ['y','paper','show','sec','sort'].forEach(k => {
      const el = ctl(pan, k);
      el.value = [...el.options].some(o => o.value === st[k]) ? st[k] : (k === 'sort' ? 'ord' : '');
    });
    ctl(pan, 'q').value = st.q;
  };
  const take = pan => {
    ['y','paper','show','sec','sort'].forEach(k => { st[k] = ctl(pan, k).value; });
    st.q = ctl(pan, 'q').value;
  };
  const render = pan => {
    const kw = st.q.trim().toLowerCase();
    let shown = 0, hidden = 0;
    pan.querySelectorAll('.q6ws').forEach(blk => {
      const tb = blk.querySelector('tbody');
      const trs = [...tb.querySelectorAll('tr[data-y]')];
      let vis = 0;
      trs.forEach(tr => {
        const d = tr.dataset;
        let ok = true;
        if(st.y && d.y !== st.y) ok = false;
        if(st.paper && d.paper !== st.paper) ok = false;
        if(st.sec && (SECG[st.sec] ? !SECG[st.sec].includes(d.sec) : d.sec !== st.sec)) ok = false;
        if(st.show && d[st.show] !== '1') ok = false;
        if(kw && !d.kw.includes(kw)) ok = false;
        tr.hidden = !ok;
        if(ok){ vis++; shown++; } else hidden++;
      });
      const key = tr => {
        const d = tr.dataset, hk = d.hk === undefined ? null : +d.hk, cls = +d.cls;
        switch(st.sort){
          case 'hk-desc': return -(hk === null ? cls : hk);
          case 'hk-asc': return (hk === null ? cls : hk);
          case 'cls-desc': return -cls;
          case 'cls-asc': return cls;
          case 'lost': return -(+d.lost);
          case 'dq': return +d.dq;
          default: return +d.ord;
        }
      };
      trs.sort((a, b) => key(a) - key(b) || (+a.dataset.ord) - (+b.dataset.ord)).forEach(tr => tb.appendChild(tr));
      const nil = tb.querySelector('.q6nil');
      const filtering = st.y || st.paper || st.sec || st.show || kw;
      blk.hidden = filtering ? vis === 0 : false;
      if(nil) nil.hidden = !!filtering;
    });
    pan.querySelector('.q6none').hidden = shown > 0;
    pan.querySelector('.q6count').textContent = '顯示 ' + shown + ' 題' + (hidden ? '，已隱藏 ' + hidden + ' 題' : '');
    pan.querySelectorAll('.q6mx .mxb').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.y === st.y && b.dataset.sec === st.sec)));
  };
  pans.forEach(pan => {
    const f = pan.querySelector('.q6f'); if(!f) return;
    f.querySelectorAll('select').forEach(el => el.addEventListener('change', () => { take(pan); render(pan); }));
    ctl(pan, 'q').addEventListener('input', () => { take(pan); render(pan); });
    ctl(pan, 'reset').addEventListener('click', () => { st = Object.assign({}, DEF); put(pan); render(pan); });
    pan.querySelectorAll('.q6mx .mxb').forEach(b => b.addEventListener('click', () => {
      const same = st.y === b.dataset.y && st.sec === b.dataset.sec;
      st = Object.assign({}, DEF, same ? {sort:st.sort} : {y:b.dataset.y, sec:b.dataset.sec, sort:st.sort});
      put(pan); render(pan);
    }));
  });
  const show = k => {
    btns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
    pans.forEach(p => { p.hidden = p.dataset.k !== k; if(!p.hidden){ cur = p; } });
    if(cur && cur.querySelector('.q6f')){ put(cur); render(cur); }
  };
  btns.forEach(b => b.addEventListener('click', () => show(b.dataset.k)));
  if(btns.length) show(btns[0].dataset.k);
}
</script>
</body>
