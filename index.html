<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S6 數學 Quiz 1 至 Quiz 7 成績分析</title>
<style>
:root{
  --paper:#FAFBFD; --ink:#1E2B45; --muted:#5E6780; --rule:#CAD4E4; --line:#E3E8F1;
  --red:#B8322A; --b0:#F3C6BF; --b1:#F7DDB0; --b2:#E7EDC6; --b3:#C6E3D2;
  --serif:"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;font-variant-numeric:tabular-nums}
a{color:var(--ink)}
a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.prose{max-width:46em}
nav{position:sticky;top:0;z-index:5;background:rgba(250,251,253,.96);border-bottom:1px solid var(--rule)}
nav .wrap{display:flex;gap:4px 20px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px;font-size:14px}
nav a{text-decoration:none;color:var(--muted)}
nav a:hover{color:var(--ink);text-decoration:underline}
header{padding:48px 0 28px}
.school{font-family:var(--serif);font-size:15px;color:var(--muted);margin:0}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,4.2vw,44px);line-height:1.25;margin:6px 0 14px;padding-bottom:14px;border-bottom:2px dotted var(--rule)}
.meta{color:var(--muted);font-size:14px;margin:0}
.verdict{margin:28px 0 8px;padding:22px 26px;border-left:4px solid var(--red);background:#fff}
.verdict h2{margin:0 0 8px;font-size:18px}
.verdict p{margin:8px 0}
.pen{text-decoration:underline wavy var(--red);text-decoration-thickness:1.5px;text-underline-offset:5px}
h2{font-family:var(--serif);font-size:28px;line-height:1.3;margin:0 0 6px}
h3{font-size:18px;margin:32px 0 8px}
section{padding:44px 0 12px;border-top:1px solid var(--rule)}
section > .wrap > .lede{color:var(--muted);margin-top:0}
.notes{font-size:14.5px;background:#fff;border:1px solid var(--line);padding:14px 20px 14px 36px;margin:18px 0}
.notes li{margin:4px 0}
.kpis{display:flex;flex-wrap:wrap;gap:12px 36px;margin:16px 0 8px}
.kpis div{min-width:120px}
.kpis b{display:block;font-family:var(--serif);font-size:26px;line-height:1.2}
.kpis span{font-size:13.5px;color:var(--muted)}
.scroll{overflow-x:auto;margin:14px 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse}
/* heatmap */
.heat{font-size:13.5px;background:#fff}
.heat th,.heat td{border:1px solid var(--line);text-align:center;padding:4px 3px;min-width:32px}
.heat thead th{font-weight:600;background:#F2F5FA;line-height:1.3}
.heat .grp{padding:6px 4px}
.heat .grp .q{display:block;font-weight:700}
.heat .grp .qn{display:block;font-weight:400;font-size:12px}
.heat .grp .dse{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.heat .mx{font-weight:400;font-size:11px;color:var(--muted)}
.heat .weak{color:var(--red);text-decoration:underline wavy var(--red);text-underline-offset:3px}
.heat .stu{position:sticky;left:0;background:#fff;text-align:left;white-space:nowrap;padding:4px 10px;min-width:92px;z-index:1}
.heat thead .stu{background:#F2F5FA}
.heat .no{color:var(--muted);font-weight:400;font-size:12px;margin-left:3px}
.heat .subv{background:#F7F9FC;font-weight:600;min-width:46px}
.heat .tot{background:#EDF1F7}
.heat .sub{min-width:46px}
.heat .raterow th,.heat .raterow td{border-top:2px solid var(--ink);font-size:12.5px}
.b0{background:var(--b0)} .b1{background:var(--b1)} .b2{background:var(--b2)} .b3{background:var(--b3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:6px 0 0}
.legend i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
/* bars */
.bars{list-style:none;padding:0;margin:10px 0;max-width:860px}
.bars li{display:grid;grid-template-columns:minmax(180px,300px) 1fr 84px;gap:12px;align-items:center;padding:3px 0;font-size:14px;border-bottom:1px dotted var(--line)}
.bl b{margin-right:4px}
.track{display:block;height:12px;background:#EEF1F6;position:relative}
.fill{display:block;height:100%}
.fill.b0{background:var(--red)} .fill.b1{background:#D9953A} .fill.b2{background:#A9B85A} .fill.b3{background:#3F8A66}
.bv{text-align:right;font-weight:600}
.bv small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;line-height:1.2}
/* comparison */
.cmp{list-style:none;padding:0;margin:12px 0;max-width:860px}
.cmp li{display:grid;grid-template-columns:minmax(180px,300px) 1fr;gap:14px;padding:8px 0;border-bottom:1px dotted var(--line);font-size:14px}
.cmp .cl small{display:block;color:var(--muted);font-size:12px}
.cmp .row{display:grid;grid-template-columns:18px 1fr 44px;gap:8px;align-items:center}
.cmp i{font-style:normal;color:var(--muted);font-size:12px}
.cmp em{font-style:normal;text-align:right;font-weight:600;font-size:13px}
.fa{background:#8C97AD} .fb{background:var(--ink)}
.cmp li.gapflag .cl b{text-decoration:underline wavy var(--red);text-underline-offset:4px}
/* student cards */
.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0 32px;margin-top:8px}
.stu-card{padding:16px 0;border-top:2px dotted var(--rule)}
.stu-card h4{margin:0;font-size:17px;display:flex;justify-content:space-between;gap:10px}
.stu-card h4 span{font-family:var(--serif);white-space:nowrap}
.stu-card dl{margin:6px 0 0;font-size:14.5px}
.stu-card dt{font-weight:600;float:left;clear:left;width:3.2em;color:var(--muted)}
.stu-card dd{margin:0 0 4px 3.4em}
.stu-card dd.miss{color:var(--ink)}
/* question commentary */
.qnotes{margin:8px 0;padding:0;list-style:none;max-width:52em}
.qnotes li{padding:8px 0;border-bottom:1px dotted var(--line)}
.qnotes b.q{display:inline-block;min-width:3.6em}
/* topics */
.topics{font-size:14.5px;background:#fff;min-width:760px}
.topics th,.topics td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
.topics thead th{background:#F2F5FA;font-size:13.5px}
.topics tbody th{font-weight:600}
.topics td small{display:block;color:var(--muted);font-size:11.5px}
.topics .ref{color:var(--muted);font-size:13px;white-space:nowrap}
.lvnote{display:block;color:var(--red);font-size:12px;margin-top:3px}
.topics .na{color:var(--rule)}
.chip{display:inline-block;padding:0 7px;font-weight:600}
.lv{font-size:13px;padding:1px 8px;white-space:nowrap;border:1px solid}
.lv0{color:#fff;background:var(--red);border-color:var(--red)}
.lv1{color:#8A4B10;border-color:#D9953A}
.lv2{color:#556018;border-color:#A9B85A}
.lv3{color:#2D6A4D;border-color:#3F8A66}
ol.priority{padding-left:1.4em;max-width:50em}
ol.priority li{margin:0 0 18px}
ol.priority li b.t{font-size:17px}
.plan{font-size:14.5px;background:#fff;min-width:760px}
.plan th,.plan td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
.plan thead th{background:#F2F5FA;font-size:13.5px}
.key{font-size:14px;background:#fff;min-width:760px}
.key th,.key td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.key thead th{background:#F2F5FA;font-size:13px}
.key td.ans{font-weight:600;white-space:nowrap}
footer{padding:28px 0 60px;color:var(--muted);font-size:13px;border-top:1px solid var(--rule);margin-top:30px}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .bars li{grid-template-columns:1fr 64px;}
  .bars li .track{grid-column:1 / -1;order:3}
  .cmp li{grid-template-columns:1fr}
  .students{grid-template-columns:1fr}
}
@media print{
  nav{display:none}
  section{page-break-inside:auto;padding-top:20px}
  .heat .stu{position:static}
  body{font-size:12.5px}
}
.heat .secrow{background:#E6EBF3;font-size:12px;font-weight:600;letter-spacing:.02em}
.secbars{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:8px 40px;margin-top:6px}
.secblock h4{font-size:16px;margin:10px 0 4px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:4px}
.secblock h4 span{font-size:13px;font-weight:400;color:var(--muted)}
.secbars .bars{max-width:none}
.secbars .bars li{grid-template-columns:1fr 64px;gap:2px 10px}
.secbars .bars li .track{grid-column:1 / -1}
/* individual table */
.indiv{font-size:14px;background:#fff;min-width:980px;width:100%}
.indiv th,.indiv td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
.indiv thead th{background:#F2F5FA;font-size:13px;white-space:nowrap;position:sticky;top:0}
.indiv .mx{font-weight:400;font-size:11px;color:var(--muted)}
.indiv .rk{font-family:var(--serif);font-size:18px;text-align:center;width:44px}
.indiv .nm{white-space:nowrap;font-size:15px;width:90px}
.indiv .nm .no{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.indiv .ts{white-space:nowrap;width:70px}
.indiv .ts b{font-family:var(--serif);font-size:20px}
.indiv .ts small{display:block;color:var(--muted);font-size:12px}
.indiv .ss{text-align:center;width:56px}
.indiv th.wlost{width:46%}
.indiv th.wprio{width:28%}
.lsec{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:3px 0}
.lsec + .lsec{border-top:1px dotted var(--line);margin-top:3px;padding-top:6px}
.stag{font-size:11.5px;font-weight:700;padding:0 6px;border:1px solid var(--ink);line-height:1.6}
.stag.sA1{background:#fff}
.stag.sA2{background:#E6EBF3}
.stag.sB{background:var(--ink);color:#fff}
.lsum{font-size:12px;color:var(--muted);margin-right:4px}
.none{font-size:13px;color:#2D6A4D}
.lq{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:3px;margin-right:10px;font-size:13px}
.lq b{font-weight:700}
.lp{font-size:12px;padding:0 5px;line-height:1.55;white-space:nowrap}
.lp.z{background:var(--b0)}
.lp.p{background:var(--b1)}
.prio{margin:0;padding-left:1.3em;font-size:14px}
.prio li{margin:0 0 6px}
.prio .pmeta{display:block;font-size:12px;color:var(--muted)}
.ptag{font-size:11px;padding:0 5px;border:1px solid;margin-left:0;display:inline-block;line-height:1.5}
.ptag.pers{color:#8A4B10;border-color:#D9953A}
.ptag.comm{color:var(--red);border-color:var(--red)}
.remark{margin:6px 0 0;font-size:12.5px;color:var(--muted);border-left:2px solid var(--rule);padding-left:8px;line-height:1.55}
.rule-note{font-size:14px;color:var(--muted);max-width:52em}
/* topic filter */
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;margin:16px 0 6px;padding:14px 16px;background:#fff;border:1px solid var(--line)}
.filters label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);gap:3px}
.filters select,.filters input{font:inherit;font-size:14px;color:var(--ink);padding:5px 8px;border:1px solid var(--rule);background:var(--paper);min-width:130px}
.filters input{min-width:170px}
.filters select:focus-visible,.filters input:focus-visible,.filters button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.filters button{font:inherit;font-size:14px;padding:5px 12px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.count{font-size:13px;color:var(--muted);margin:4px 0 0}
.topics2{font-size:14px;background:#fff;min-width:1000px;width:100%}
.topics2 th,.topics2 td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
.topics2 thead th{background:#F2F5FA;font-size:13px;white-space:nowrap}
.topics2 .qref{font-size:13px;white-space:nowrap;line-height:1.55}
.topics2 .qref small{display:block;color:var(--muted);font-size:11.5px}
.topics2 .subs{font-size:12px;line-height:1.9}
.topics2 .subs span{display:inline-block;padding:0 5px;margin:0 3px 2px 0;white-space:nowrap}
.topics2 .subs i{font-style:normal;color:var(--muted);margin-right:4px}
.topics2 td small{display:block;color:var(--muted);font-size:11.5px}
.topics2 .na{color:var(--rule)}
.topics2 details summary{cursor:pointer;font-size:13px;white-space:nowrap}
.topics2 details div{font-size:12.5px;color:var(--muted);max-width:14em;margin-top:3px}
.topics2 tr.empty td{color:var(--muted);text-align:center;padding:24px}
/* quiz banner + student section */
.qbadge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border:1px solid var(--ink);margin-right:8px;vertical-align:3px}
.qbadge.q2{background:var(--ink);color:#fff}
.setsub{margin:34px 0 4px;font-family:var(--serif);font-size:22px;border-bottom:2px solid var(--ink);padding-bottom:5px}
.thin{font-size:13.5px;color:var(--muted);background:#fff;border:1px solid var(--line);border-left:3px solid #D9953A;padding:10px 14px;margin:12px 0;max-width:52em}
.stubar{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.stubar button{font:inherit;font-size:14px;padding:5px 11px;border:1px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer}
.stubar button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.stubar button .tagboth{font-size:11px;margin-left:5px;opacity:.75}
.stubar button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.spanel{background:#fff;border:1px solid var(--line);border-top:3px solid var(--ink);padding:20px 22px;margin-top:8px}
.spanel h4{margin:0 0 2px;font-size:19px;font-family:var(--serif)}
.spanel .sub{margin:0 0 14px;font-size:13px;color:var(--muted)}
.qcompare{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 26px;margin-bottom:6px}
.qcard{border:1px solid var(--line);padding:12px 14px}
.qcard h5{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;align-items:baseline}
.qcard h5 em{font-style:normal;color:var(--muted);font-size:12px}
.qcard .big{font-family:var(--serif);font-size:26px;line-height:1.1}
.qcard .big span{font-size:13px;color:var(--muted);font-family:var(--sans)}
.qcard dl{margin:8px 0 0;font-size:13px}
.qcard dt{float:left;clear:left;width:4.2em;color:var(--muted)}
.qcard dd{margin:0 0 3px 4.4em}
.qcard .miss{color:var(--rule)}
.delta{font-size:13px;font-weight:600;padding:0 6px;white-space:nowrap}
.delta.up{color:#2D6A4D;border:1px solid #3F8A66}
.delta.dn{color:var(--red);border:1px solid var(--red)}
.delta.eq{color:var(--muted);border:1px solid var(--rule)}
.tsec{margin-top:18px}
.tsec h5{margin:0 0 4px;font-size:15px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.tsec h5 em{font-style:normal;font-size:12.5px;color:var(--muted);font-weight:400}
.tgrid{width:100%;font-size:13.5px;border-collapse:collapse}
.tgrid th,.tgrid td{border-bottom:1px dotted var(--line);padding:6px 6px;text-align:left;vertical-align:top}
.tgrid thead th{font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--rule)}
.tgrid .tq{color:var(--muted);font-size:12px;white-space:nowrap}
.tgrid .sc{white-space:nowrap;text-align:center;width:74px}
.tgrid .sc span{display:inline-block;padding:0 6px;font-weight:600}
.tgrid .sc small{display:block;color:var(--muted);font-size:11px}
.tgrid .dl{width:70px;text-align:center}
.tgrid .na{color:var(--rule)}
.verdicts{display:flex;flex-wrap:wrap;gap:6px 8px;margin:10px 0 0}
.vtag{font-size:12.5px;padding:1px 8px;border:1px solid}
.vtag.keep{color:#2D6A4D;border-color:#3F8A66}
.vtag.warn{color:#8A4B10;border-color:#D9953A}
.vtag.bad{color:var(--red);border-color:var(--red)}
.crosstable{font-size:14px;background:#fff;min-width:860px;width:100%}
.crosstable th,.crosstable td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:middle}
.crosstable thead th{background:#F2F5FA;font-size:13px;white-space:nowrap}
.crosstable .nm{white-space:nowrap}
.crosstable .nm .no{display:block;font-size:12px;color:var(--muted);font-weight:400}
.crosstable td.c{text-align:center;white-space:nowrap}
.crosstable .mini{display:inline-block;padding:0 7px;font-weight:600}
.crosstable .secmini{font-size:12px;color:var(--muted);white-space:nowrap}
.crosstable .secmini b{color:var(--ink)}
.topics2 .strand{font-size:12.5px;color:var(--muted);white-space:nowrap}
.topics2 .subs2{display:block;font-size:11.5px;line-height:1.8;margin-top:2px}
.topics2 .subs2 span{display:inline-block;padding:0 4px;margin:0 3px 2px 0;white-space:nowrap}
.topics2 td.off{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#F4F6FA 4px,#F4F6FA 8px)}
.topics2 .qref div{margin-bottom:3px}
.topics2 .qref small{display:block;color:var(--muted);font-size:11px}
.qcard .mut{color:var(--muted)}
.tgrid .unit{font-weight:400;font-size:10.5px;color:var(--muted)}
.crosstable .secmini{display:inline-flex;align-items:baseline;gap:5px;margin:0 12px 3px 0;font-size:12.5px;color:var(--muted)}
.crosstable .secmini u{text-decoration:none;font-weight:700;color:var(--ink);border:1px solid var(--rule);padding:0 5px}
.crosstable .secmini i{font-style:normal;font-size:11px}
.crosstable .secmini b{color:var(--ink)}
@media (max-width:640px){
  .spanel{padding:16px 14px}
  .tsec{overflow-x:auto}
  .tgrid{min-width:520px}
  .qcompare{grid-template-columns:1fr}
  .stubar button{font-size:13px;padding:4px 9px}
}
.plan .tagtop{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;color:#fff;background:var(--red);padding:0 6px;vertical-align:2px}
.dseref{display:block;color:var(--muted);font-size:11px;font-weight:400;line-height:1.5}
.bars .bl .dseref{margin-top:1px}
.lq .dseref{display:inline;margin:0 4px 0 2px}
.prio .pdse{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.sfilters{margin-bottom:4px}
.misslist{display:block;margin-top:3px;line-height:1.9}
.misslist .lp{margin-right:4px}
.tgrid .sc small{font-size:10.5px;line-height:1.4}
.tgrid th .unit{display:block}
.lvtag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;white-space:nowrap;border:1px solid}
.lvl1{color:var(--red);border-color:var(--red);background:#FBEDEB}
.lvl2{color:#8A4B10;border-color:#D9953A;background:#FBF2E4}
.lvl3{color:#556018;border-color:#A9B85A;background:#F4F7E8}
.lvl4{color:#2D6A4D;border-color:#3F8A66;background:#EAF4EE}
.lvl5{color:#fff;background:#2D6A4D;border-color:#2D6A4D}
.heat .lvcol{min-width:64px}
.sdnote{font-size:11px;color:var(--muted);font-weight:400}
.indiv .ss .msd{display:block;color:var(--muted);font-size:10.5px;line-height:1.35;margin-top:3px}
.grpstat{font-size:13.5px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:8px 12px;margin:10px 0 0}
/* energy bars */
.ebar{position:relative;display:block;height:9px;background:#EEF1F6;border:1px solid var(--line);min-width:70px}
.efill{display:block;height:100%}
.efill.b0{background:var(--red)} .efill.b1{background:#D9953A} .efill.b2{background:#A9B85A} .efill.b3{background:#3F8A66}

<script>
(function(){try{ if(window.self!==window.top) document.documentElement.classList.add('embedded'); }
catch(e){ document.documentElement.classList.add('embedded'); }})();
</script>

<div class="gate" id="gate">
  <div class="card">
    <p class="school">廖寶珊紀念書院　中六數學（必修部分）</p>
    <h1>Quiz 1 至 Quiz 7 成績分析</h1>
    <label for="pw">輸入密碼以查看報告</label>
    <div class="pwrow"><span class="pwbox"><input id="pw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"><button type="button" id="eye" class="eye" aria-pressed="false" aria-controls="pw">顯示</button></span><button type="button" id="go">解鎖報告</button></div>
    <p class="msg" id="msg" role="alert"></p>
    <p class="hint">報告內容已加密，包含學生姓名及分數，請勿轉發密碼。</p>
    <p class="jswarn" id="jsWarn">⚠️ 這個畫面的程式未能執行，所以按「解鎖報告」不會有反應。請先把檔案下載到電腦，再用 Chrome、Edge 或 Safari 直接開啟（不要在預覽視窗或雲端硬碟內開啟）。</p>
    <p class="build">版本 2026-10-28（Quiz 5：Group A 17 人、Group B 12 人；Quiz 6–7 卷二 MC：DSE 2024、DSE 2025）</p>
  </div>
</div>
<div id="app" hidden></div>
<script>


function initReport(DATA){
const TOPICS = DATA.topics, STUDENTS = DATA.students, TNAME = DATA.tname;
const QMETA = DATA.quizzes;
const QIDS = QMETA.map(m => m.id);
const QLBL = Object.fromEntries(QMETA.map(m => [m.id, `${m.label}（${m.paper}）`]));
const QSHORT = Object.fromEntries(QMETA.map(m => [m.id, m.label]));
const QPAPER = Object.fromEntries(QMETA.map(m => [m.id, m.paper]));
const CIRC = '①②③④⑤⑥';
const GRP = {A:'Group A', B:'Group B'};
const SECNAME = {A1:'Section A(1)', A2:'Section A(2)', B:'Section B'};
const SECORD = {A1:0, A2:1, B:2};
const LV = ['急需補救','需加強','大致掌握','穩固'];
const KEYS = QIDS.flatMap(q => ['A','B'].map(g => q+g));
const pc = x => Math.floor(x*100+0.5);
const lvOf = r => r===null ? 9 : (r<0.3?0:r<0.6?1:r<0.85?2:3);
const bin = r => r===0?'b0':r<0.5?'b1':r<1?'b2':'b3';
const $ = id => document.getElementById(id);
const lvcls = lv => 'lvl' + ((lv.replace('Level ','').replace('+','').split(' ')[0].match(/^\d$/)||['3'])[0]);
function ebar(rate, mark){
  const w = Math.max(rate*100, rate>0?1.5:0);
  const tick = (mark===null||mark===undefined) ? '' : `<i class="tick" style="left:${Math.min(Math.max(mark*100,0),100)}%" title="同組平均 ${pc(mark)}%"></i>`;
  return `<span class="ebar"><span class="efill ${bin(rate)}" style="width:${w}%"></span>${tick}</span>`;
}

/* ---------- topic table ---------- */
function scope(){
  const q = $('fQuiz').value, s = $('fSet').value;
  return KEYS.filter(k => (!q || k.startsWith(q)) && (!s || k.endsWith(s)));
}
function agg(t, keys){
  let g=0, m=0;
  keys.forEach(k => { const c = t.cells[k]; if(c){ g += c.g; m += c.m; } });
  return m ? {g:g, m:m, r:g/m} : null;
}
function cell(t, k){
  const c = t.cells[k];
  if(!c) return '<td class="na">—</td>';
  const r = c.g/c.m;
  const subs = c.sub.map(([code,v],i) => `<span class="${bin(v/100)}" title="${c.dse[i]||''}">${code} ${v}%</span>`).join('');
  return `<td><span class="chip ${bin(r)}">${pc(r)}%</span>
    <small class="msd">平均 ${c.mu}/${c.full}　SD ${c.sd}</small>
    <small>${c.g}/${c.m}　${c.q.join('、')}</small><span class="subs2">${subs}</span></td>`;
}
function renderTopics(){
  const keys = scope();
  const sec=$('fSec').value, lv=$('fLv').value, sort=$('fSort').value, q=$('fText').value.trim().toLowerCase();
  const qf = $('fQuiz').value, sf = $('fSet').value;
  $('tHead').innerHTML = `<tr><th>Section</th><th>範疇</th><th>課題</th><th>題目及 DSE 出處</th>
    ${keys.map(k => `<th>${QSHORT[k.slice(0,2)]}<br><span class="mx">${QPAPER[k.slice(0,2)]}　${GRP[k.slice(2)]}</span></th>`).join('')}
    <th>${(qf||sf) ? '所選範圍' : '合計'}</th><th>判斷</th><th>失分學生</th></tr>`;
  let rows = TOPICS.filter(t => {
    const a = agg(t, keys);
    if(!a && (qf || sf)) return false;
    if(sec && !(t.secs||[t.sec]).includes(sec)) return false;
    if(lv!=='' && String(lvOf(a?a.r:null))!==lv) return false;
    if(q){
      const parts = [t.name, t.strand, t.sec];
      KEYS.forEach(k => { const c=t.cells[k]; if(c){ parts.push(c.q.join(' '), c.dse.join(' '), QSHORT[k.slice(0,2)], GRP[k.slice(2)]); } });
      if(!parts.join(' ').toLowerCase().includes(q)) return false;
    }
    return true;
  });
  rows.sort((a,b)=>{
    if(sort==='q') return SECORD[a.sec]-SECORD[b.sec] || a.name.localeCompare(b.name,'zh-HK');
    if(sort==='strand') return a.strand.localeCompare(b.strand,'zh-HK') || SECORD[a.sec]-SECORD[b.sec];
    if(sort==='dse'){
      const n = t => Math.min(...keys.filter(k=>t.cells[k]).map(k=>t.cells[k].dseq).concat([999]));
      return n(a)-n(b) || SECORD[a.sec]-SECORD[b.sec];
    }
    const ra=agg(a,keys), rb=agg(b,keys);
    if(!ra) return 1; if(!rb) return -1;
    if(sort==='lost') return (rb.m-rb.g)-(ra.m-ra.g) || ra.r-rb.r;
    return ra.r-rb.r || (rb.m-rb.g)-(ra.m-ra.g);
  });
  $('tBody').innerHTML = rows.map(t => {
    const a = agg(t, keys), l = lvOf(a?a.r:null);
    const qref = keys.filter(k=>t.cells[k]).map(k =>
      `<div><b>${QSHORT[k.slice(0,2)]} ${GRP[k.slice(2)]}</b> ${t.cells[k].q.join('、')}<small>${t.cells[k].dse.join('、')}</small></div>`).join('') || '<span class="na">—</span>';
    let note = '';
    if(a && keys.length>1){
      keys.forEach(k => { const c=t.cells[k]; if(c && c.g/c.m <= a.r-0.25)
        note = `<small class="lvnote">${QSHORT[k.slice(0,2)]} ${GRP[k.slice(2)]} 只有 ${pc(c.g/c.m)}%</small>`; });
    }
    const who = keys.flatMap(k => (t.cells[k]?t.cells[k].who:[]).map(n => QSHORT[k.slice(0,2)]+' '+GRP[k.slice(2)]+'：'+n));
    const whoHtml = !a ? '<span class="na">—</span>'
      : who.length ? `<details><summary>${who.length} 人次</summary><div>${who.join('、')}</div></details>`
      : '<span class="none">全對</span>';
    const grps = [...new Set(keys.filter(k=>t.cells[k]).map(k=>k.slice(2)))].sort()
      .map(g => `<span class="gtag g${g}">${GRP[g]}</span>`).join('');
    return `<tr><td><span class="stag s${t.sec}">${t.sec}</span>${grps}</td><td class="strand">${t.strand}</td>
      <th>${t.name}</th><td class="qref">${qref}</td>
      ${keys.map(k => cell(t,k)).join('')}
      <td>${a?ebar(a.r,null):''}<b>${a?pc(a.r)+'%':'—'}</b>${a?`<small>${a.g}/${a.m}</small>`:''}</td>
      <td>${l===9?'<span class="lv">未有數據</span>':`<span class="lv lv${l}">${LV[l]}</span>`}${note}</td>
      <td>${whoHtml}</td></tr>`;
  }).join('') || `<tr class="empty"><td colspan="${keys.length+7}">沒有符合條件的課題，請放寬篩選條件。</td></tr>`;
  $('tCount').textContent = `顯示 ${rows.length} 個課題（共 ${TOPICS.length} 個）`;
}

/* ---------- by-student ---------- */
function deltaTag(d){
  if(d===null) return '<span class="delta eq">—</span>';
  if(d>0) return `<span class="delta up">▲ ${d} 個百分點</span>`;
  if(d<0) return `<span class="delta dn">▼ ${-d} 個百分點</span>`;
  return '<span class="delta eq">持平</span>';
}
function studGroups(p){ return [...new Set(QIDS.filter(q=>p.quizzes[q]).map(q=>p.quizzes[q].set))]; }
const has = p => QIDS.filter(q => p.quizzes[q]);
const yearSel = () => ($('sYear') ? $('sYear').value : '');
const vis = p => { const y = yearSel(); return has(p).filter(q => !y || q===y); };
function lastTwo(p){ const h = has(p); return h.length>1 ? [p.quizzes[h[h.length-2]], p.quizzes[h[h.length-1]]] : null; }
function renderCross(){
  const q = $('cQ').value.trim().toLowerCase(), gf = $('cGrp').value, rf = $('cRec').value,
        lf = $('cLv').value, sort = $('cSort').value;
  const latest = p => { const h = has(p); return p.quizzes[h[h.length-1]]; };
  const rateOf = p => { const z = latest(p); return z.total/z.max; };
  const avgOf = p => { const zs = has(p).map(x=>p.quizzes[x]);
    return zs.reduce((t,z)=>t+z.total,0)/zs.reduce((t,z)=>t+z.max,0); };
  const deltaOf = p => { const lt = lastTwo(p); return lt ? pc(lt[1].total/lt[1].max)-pc(lt[0].total/lt[0].max) : null; };
  $('crossHead').innerHTML = `<tr><th>學生</th><th class="c">分組</th>
    ${QIDS.map((x,i)=>`<th class="c">${CIRC[i]} ${QSHORT[x]}<br><span class="mx">${QPAPER[x]}</span></th>`).join('')}
    <th class="c">最近兩卷變化</th><th class="c">所有卷平均得分</th><th class="eb">平均得分率</th><th>各部分表現（本人得分／滿分）</th></tr>`;
  let list = STUDENTS.filter(p => {
    const gs = studGroups(p);
    if(gf && !gs.includes(gf)) return false;
    const n = has(p).length;
    if(rf==='all' && n<QIDS.length) return false;
    if(rf==='multi' && n<2) return false;
    if(rf==='one' && n>1) return false;
    if(lf && !QIDS.some(x=>p.quizzes[x] && p.quizzes[x].level===lf)) return false;
    if(q && !(p.name.toLowerCase().includes(q) || (p.nos||[p.no]).join(' ').includes(q))) return false;
    return true;
  });
  list.sort((x,y) => {
    if(sort==='no') return x.no-y.no;
    if(sort==='avg-desc') return avgOf(y)-avgOf(x);
    if(sort.startsWith('delta')){
      const a=deltaOf(x), b=deltaOf(y);
      if(a===null) return 1; if(b===null) return -1;
      return sort==='delta-desc' ? b-a : a-b;
    }
    return sort==='rate-asc' ? rateOf(x)-rateOf(y) : rateOf(y)-rateOf(x);
  });
  $('cCount').textContent = `顯示 ${list.length} 位學生（共 ${STUDENTS.length} 位）`;
  const cellQ = z => z ? `<span class="mini ${bin(z.total/z.max)}">${z.total}/${z.max}</span><small>${GRP[z.set]}　${pc(z.total/z.max)}%</small><span class="lvtag ${lvcls(z.level)}" title="${z.rule}">${z.level}</span>` : '<span class="na">未有記錄</span>';
  $('crossBody').innerHTML = list.map(p => {
    const d = deltaOf(p);
    const secs = ['A1','A2','B'].map(s => {
      const parts = QIDS.filter(x=>p.quizzes[x] && p.quizzes[x].secs[s])
        .map(x => `<i>Q${x.slice(1)}</i> <b>${p.quizzes[x].secs[s].g}/${p.quizzes[x].secs[s].m}</b>`);
      return parts.length ? `<span class="secmini"><u>${s}</u>${parts.join('')}</span>` : '';
    }).filter(Boolean).join('');
    const zs = has(p).map(x=>p.quizzes[x]);
    const avgG = zs.reduce((t,z)=>t+z.total,0)/zs.length;
    const avgM = zs.reduce((t,z)=>t+z.max,0)/zs.length;
    const rate = zs.reduce((t,z)=>t+z.total,0)/zs.reduce((t,z)=>t+z.max,0);
    const gs = studGroups(p).map(g => `<span class="gtag g${g}">${GRP[g]}</span>`).join('');
    return `<tr><th class="nm">${p.name}<span class="no">學號 ${(p.nos||[p.no]).join(' / ')}</span></th>
      <td class="c">${gs}</td>
      ${QIDS.map(x => `<td class="c">${cellQ(p.quizzes[x])}</td>`).join('')}
      <td class="c">${d!==null?deltaTag(d):'<span class="delta eq">只有一次</span>'}</td>
      <td class="c"><b>${avgG.toFixed(1)}</b><small>/${avgM.toFixed(1)}</small><small class="sdline">${zs.length} 卷平均</small></td>
      <td class="eb">${ebar(rate,null)}<em>${pc(rate)}%</em></td>
      <td>${secs}</td></tr>`;
  }).join('') || `<tr class="empty"><td colspan="${QIDS.length+6}">沒有符合條件的學生，請放寬篩選條件。</td></tr>`;
}
function renderBar(active){
  $('stuBar').innerHTML = STUDENTS.map((p,i) => {
    const n = has(p).length;
    return `<button type="button" data-i="${i}" aria-pressed="${i===active}">${p.name}${n>1?`<span class="tagboth">${n} 次</span>`:''}</button>`;
  }).join('');
  $('stuBar').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => { renderBar(+b.dataset.i); renderPanel(+b.dataset.i); }));
}
function renderPanel(i){
  window.__stu = i;
  const p = STUDENTS[i];
  const qids = vis(p);
  const yr = yearSel();
  if(!qids.length){
    $('stuPanel').innerHTML = `<h4>${p.name}<span class="sub">　學號 ${(p.nos||[p.no]).join(' / ')}</span></h4>
      <p class="none">這位同學沒有 ${QPAPER[yr]} 的記錄。可在「試卷年份」選回「所有年份」，或選擇其他同學。</p>`;
    $('sCount').textContent = '顯示 0 個課題';
    return;
  }
  const cards = qids.map(q => {
    const z = p.quizzes[q];
    const secs = ['A1','A2','B'].map(s => {
      const v = z.secs[s];
      if(!v) return `<tr><th>${s}</th><td colspan="3" class="miss">本卷不設</td></tr>`;
      const rate = v.g/v.m, d = v.sd ? ((v.g-v.mu)/v.sd) : null;
      return `<tr><th>${s}</th><td class="sc2"><b>${v.g}</b><small>/${v.m}</small></td>
        <td class="eb">${ebar(rate, v.mu/v.m)}<em>${pc(rate)}%</em></td>
        <td class="ms">平均 ${v.mu}　SD ${v.sd}${d===null?'':`<small>${d>=0?'+':''}${d.toFixed(1)} SD</small>`}</td></tr>`;
    }).join('');
    return `<div class="qcard"><h5>${CIRC[QIDS.indexOf(q)]} ${QLBL[q]}<em>Set ${z.set}</em></h5>
      <p class="big">${z.total}<span>/${z.max}　${pc(z.total/z.max)}%</span>
        <span class="lvtag ${lvcls(z.level)}" title="${z.rule}">${z.level}</span></p>
      <p class="sub">組內排名 ${z.rank}／${z.n}　組平均 ${z.mu}　SD ${z.sd}${z.z===null?'':`　本人 ${z.z>=0?'+':''}${z.z} SD`}</p>
      <table class="sectab"><thead><tr><th>Part</th><th class="sc2">得分</th><th class="eb">得分率</th><th class="ms">組別平均／SD</th></tr></thead><tbody>${secs}</tbody></table></div>`;
  }).join('');
  const multi = qids.length > 1;
  $('stuPanel').innerHTML = `<h4>${p.name}<span class="sub">　學號 ${(p.nos||[p.no]).join(' / ')}</span></h4>
    <p class="sub">${multi ? `共有 ${qids.length} 次測驗記錄（${qids.map(q=>QSHORT[q]).join('、')}），可比較同一課題的變化。`
      : (yr ? `只顯示 ${QLBL[qids[0]]} 的記錄（已按試卷年份篩選，此同學另有 ${has(p).length-1} 次其他記錄）。`
            : '目前只有 '+QLBL[qids[0]]+' 的記錄，下表列出該次的課題強弱。')}</p>
    <div class="qcompare">${cards}</div>${multi?sectionTrend(p):''}<div id="stuTopics"></div>`;
  renderStuTopics();
}
function sectionTrend(p){
  const qids = has(p);
  const SEC = ['A1','A2','B'].filter(s => qids.some(q => p.quizzes[q].secs[s]));
  const COL = {A1:'#1F6F5C', A2:'#C07C1E', B:'#5AA3A0'};
  const W=680, H=252, L=52, Rr=122, T=26, Bm=34;
  const x = k => L + k*(W-L-Rr)/Math.max(qids.length-1,1);
  const y = v => T + (1-v/100)*(H-T-Bm);
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="trend" role="img" aria-label="各次測驗各 Section 得分率比較">`;
  [0,25,50,75,100].forEach(g => {
    svg += `<line x1="${L}" y1="${y(g)}" x2="${W-Rr}" y2="${y(g)}" class="gl"/><text x="${L-8}" y="${y(g)+4}" class="ax" text-anchor="end">${g}</text>`;
  });
  qids.forEach((q,k) => { const an = k===0?'start':'middle';
    svg += `<text x="${x(k)}" y="${H-12}" class="ax" text-anchor="${an}">${CIRC[QIDS.indexOf(q)]} ${QPAPER[q]}</text>`; });
  const series = SEC.map(s => ({s:s, pts: qids.map((q,k) => {
    const v = p.quizzes[q].secs[s];
    return v ? {x:x(k), y:y(100*v.g/v.m), t:pc(v.g/v.m), k:k} : null; }).filter(Boolean)}));
  qids.forEach((q,k) => {
    const col = series.map(se => se.pts.find(pt => pt.k===k)).filter(Boolean).sort((a,b)=>a.y-b.y);
    col.forEach((pt,n) => { pt.ly = pt.y + ((n>0 && pt.y - col[n-1].y < 16) ? 18 : -10); });
  });
  const ends = series.map(se => ({s:se.s, pt:se.pts[se.pts.length-1]})).filter(e=>e.pt).sort((a,b)=>a.pt.y-b.pt.y);
  for(let n=1;n<ends.length;n++){ if(ends[n].pt.y - (ends[n-1].gy||ends[n-1].pt.y) < 16) ends[n].gy = (ends[n-1].gy||ends[n-1].pt.y) + 16; }
  series.forEach(se => {
    if(se.pts.length>1) svg += `<path d="M${se.pts.map(pt=>pt.x+' '+pt.y).join(' L')}" fill="none" stroke="${COL[se.s]}" stroke-width="2.5"/>`;
    se.pts.forEach(pt => {
      svg += `<circle cx="${pt.x}" cy="${pt.y}" r="4.5" fill="${COL[se.s]}"/>`;
      svg += `<text x="${pt.x+(pt.k===0?7:0)}" y="${pt.ly}" class="pv" text-anchor="${pt.k===0?'start':'middle'}" fill="${COL[se.s]}">${pt.t}%</text>`;
    });
  });
  ends.forEach(e => {
    const gy = e.gy || e.pt.y;
    if(Math.abs(gy - e.pt.y) > 1) svg += `<line x1="${e.pt.x+4}" y1="${e.pt.y}" x2="${e.pt.x+11}" y2="${gy-4}" stroke="${COL[e.s]}" stroke-width="1"/>`;
    svg += `<text x="${e.pt.x+13}" y="${gy}" class="lg" fill="${COL[e.s]}">${SECNAME[e.s]}</text>`;
  });
  svg += '</svg>';
  const rows = SEC.concat(['TOT']).map(s => {

      if(pres.length>1){ const a = pres[pres.length-2], b = pres[pres.length-1]; dv = pc(b.g/b.m) - pc(a.g/a.m); }
      const lost = pres.reduce((t,c)=>t+c.m-c.g,0);

      if(show==='drop' && !(dv!==null && dv<0)) return null;
      if(show==='ok' && gap!==1) return null;

        const hay = [TNAME[id], ...pres.flatMap(c=>c.dse)].join(' ').toLowerCase();

      }

    }).filter(Boolean);

      : sort==='lost' ? b.lost-a.lost || a.r-b.r : a.r-b.r || b.lost-a.lost);

  }).join('');

     m:[3,3,3,3,4,2,1,2,2,1,2,3,2,1,1, 3,3,3,2,3,2,2,1,1,0,3,3,3, 2,1,2,2,2,0,2,1,0,4,0,0,0],

    {key:'Y5B', lv:'5',  set:'B', color:'#7F8722', total:154, p1adj:90, p1w:98, p2:33, p2w:56, sec:{A1:30,A2:34,B:26},
     m:[3,3,3,3,4,3,1,2,2,1,0,3,1,0,1, 3,3,3,3,3,1,2,1,3,3,3,3,3, 2,2,2,1,3,2,2,4,0,4,2,2,0]},
    {key:'Y5C', lv:'5',  set:'C', color:'#5C6214', total:155, p1adj:88, p1w:95, p2:35, p2w:60, sec:{A1:32,A2:31,B:25},
     m:[3,3,3,3,4,3,1,2,2,1,2,3,0,1,1, 3,2,3,1,3,1,2,1,3,3,3,3,3, 2,0,2,1,3,3,2,3,1,4,2,2,0]},
    {key:'Y6A', lv:'5*', set:'A', color:'#2D6A4D', total:162, p1adj:87, p1w:94, p2:40, p2w:68, sec:{A1:33,A2:34,B:20},
     m:[3,3,3,3,4,3,1,2,2,1,2,2,2,1,1, 3,3,3,3,3,2,2,1,3,2,3,3,3, 2,2,1,1,3,3,2,3,1,2,0,0,0]}

      '5*（Set A）考生 Section B 只得 20 分，低於 Level 5 平均；升上 5* 靠的是 Section A 合計 67/70 及卷二 MC 40/45（八人最高）。',
      '19(b)(iii)（坐標幾何 II）八人全部 0 分；18(b)(ii)（續函數及其圖像）八人合共只得 2/24；19(b)(i) 及 (ii) 只有 Level 5 的 Set B、Set C 取得滿分。',
      'Section A(1) 最常錯的是 9(c)（續統計）：八人全部只得 1/2；Section A(2) 則集中在 13(b)、13(c)（坐標幾何 II），合共失 11 及 10 分。',
      '卷二 MC 的等級差距比 DSE 2026 那批考生明顯：Level 4 平均 29.0、Level 5 平均 34.3、5* 40 分；Level 4（Set B）Section B 只得 6/35，卷一後段幾乎沒有取分。'
    ],
    source:'八份 DSE 2025 數學必修部分評卷紀錄（Level 4 四份、Level 5 三份、5* 一份，同級考生按科目得分由低至高以 Set A 至 D 區分）。2025 年科目得分滿分為 191。',
    topicNote:'課題分類依 HKDSE 2025 卷一課題對照表。'};
})())
];

function dseBuildYear(ds, box){
  const T = DSE_T, {ITEMS, CANDS, SECMAX} = ds, SUBJ = ds.subjMax;
  const SECN = {A1:'Section A(1)', A2:'Section A(2)', B:'Section B'};
  const pc = x => Math.round(x*100);
  const bin = r => r===0?'b0':r<0.5?'b1':r<1?'b2':'b3';
  const tp = it => it.tp.map(k=>T[k]).join('、');
  const lvc = c => c.lv==='4' ? 'lvl4' : 'lvl5';
  const bar = r => `<span class="ebar"><span class="efill ${bin(r)}" style="width:${Math.max(r*100, r>0?1.5:0)}%"></span></span>`;
  const got = it => CANDS.reduce((t,c)=>t+c.m[ITEMS.indexOf(it)],0);
  const lostBy = it => CANDS.filter(c => c.m[ITEMS.indexOf(it)] < it.max);
  const q = id => box.querySelector('#'+id);

  /* ---- 1. 各 Section 分數比較：折線圖 + 表 ---- */
  const N = CANDS.length, CN = ['零','一','二','三','四','五','六','七','八','九','十','十一','十二'][N] || N;
  const SERIES = [
    {k:'A1', name:'Section A(1)', max:35,  col:'#1F6F5C', v:c=>c.sec.A1},
    {k:'A2', name:'Section A(2)', max:35,  col:'#C07C1E', v:c=>c.sec.A2},
    {k:'B',  name:'Section B',    max:35,  col:'#5AA3A0', v:c=>c.sec.B},
    {k:'MC', name:'卷二 MC',       max:45,  col:'#6B5CA5', v:c=>c.p2}
  ];
  const trendOn = new Set(['A1','A2','B']);
  const trendLO = Math.max(0, Math.min(40, Math.floor(Math.min(...CANDS.flatMap(c => SERIES.map(se => 100*se.v(c)/se.max))) / 10) * 10));
  function trendSVG(){
    const W=880, H=420, L=46, Rr=112, T=26, Bm=52, LO=trendLO, HI=100;
    const x = k => L + 18 + k*(W-L-Rr-36)/Math.max(N-1,1);
    const y = v => T + (HI-v)/(HI-LO)*(H-T-Bm);
    let svg = `<svg viewBox="0 0 ${W} ${H}" class="dse-trend" role="img" aria-label="各等級考生各 Section 得分率比較">`;
    for(let g=LO; g<=HI; g+=10) svg += `<line x1="${L}" y1="${y(g)}" x2="${W-Rr+6}" y2="${y(g)}" class="gl"/><text x="${L-8}" y="${y(g)+4}" class="ax" text-anchor="end">${g}</text>`;
    CANDS.forEach((c,k) => {
      svg += `<text x="${x(k)}" y="${H-Bm+20}" class="xl" text-anchor="middle">${c.lv}<tspan class="xs"> ${c.set}</tspan></text>
        <text x="${x(k)}" y="${H-Bm+36}" class="xs" text-anchor="middle">${c.total}</text>`;
    });
    const act = SERIES.filter(se => trendOn.has(se.k));
    const pts = act.map(se => ({se, pts: CANDS.map((c,k) => { const v = se.v(c), r = 100*v/se.max;
      return {x:x(k), y:y(Math.max(r,LO)), t:Math.round(r), k, v, c}; })}));
    /* 同一欄的數值標籤由上而下排，避免重疊 */
    CANDS.forEach((c,k) => {
      const col = pts.map(s => s.pts[k]).sort((a,b) => a.y-b.y);
      const used = [];
      col.forEach(pt => {
        const cands = [pt.y - 8, pt.y + 16, pt.y - 20, pt.y + 28];
        let ly = cands.find(v => used.every(u => Math.abs(u - v) >= 12));
        if(ly===undefined) ly = Math.max(...used) + 12;
        pt.ly = ly; used.push(ly);
      });
    });
    pts.forEach(({se, pts}) => {
      svg += `<path d="M${pts.map(p=>p.x+' '+p.y).join(' L')}" fill="none" stroke="${se.col}" stroke-width="2.5" stroke-linejoin="round"/>`;
      pts.forEach(p => {
        svg += `<g><title>${p.c.label}（Set ${p.c.set}）${se.name}：${p.v}/${se.max}（${p.t}%）</title><circle cx="${p.x}" cy="${p.y}" r="4.5" fill="${se.col}"/></g>`;
        svg += `<text x="${p.x}" y="${p.ly}" class="pv" fill="${se.col}" text-anchor="middle">${p.t}%</text>`;
      });
    });
    const ends = pts.map(s => ({se:s.se, y:s.pts[N-1].y})).sort((a,b) => a.y-b.y);
    for(let n=1; n<ends.length; n++) if(ends[n].y - ends[n-1].y < 15) ends[n].y = ends[n-1].y + 15;
    ends.forEach(e => { svg += `<text x="${x(N-1)+44}" y="${e.y+4}" class="lg" fill="${e.se.col}">${e.se.name}</text>`; });
    return svg + '</svg>';
  }
  const trendBtns = SERIES.map(se => `<button type="button" data-k="${se.k}" aria-pressed="${trendOn.has(se.k)}"><i style="background:${se.col}"></i>${se.name}</button>`).join('');
  const trendRows = [
    {name:'Section A(1)', max:35,  v:c=>c.sec.A1},
    {name:'Section A(2)', max:35,  v:c=>c.sec.A2},
    {name:'Section B',    max:35,  v:c=>c.sec.B},
    {name:'卷一合計',      max:105, v:c=>c.p1adj, cls:'p1'},
    {name:'卷二 MC',       max:45,  v:c=>c.p2},
    {name:'科目得分',      max:SUBJ, v:c=>c.total, cls:'tot'}
  ].map(r => {
    const vals = CANDS.map(r.v), avg = vals.reduce((t,v)=>t+v,0)/(N*r.max), hi = Math.max(...vals);
    return `<tr class="${r.cls||''}"><th>${r.name}<span class="unit">滿分 ${r.max}</span></th>
      ${vals.map(v => `<td class="c${v===hi?' hi':''}"><b>${v}</b><small class="of">/${r.max}</small><small class="pc">${pc(v/r.max)}%</small></td>`).join('')}
      <td class="eb">${bar(avg)}<em>${pc(avg)}%</em></td></tr>`;
  }).join('');
  const trendHead = `<tr><th>分卷</th>${CANDS.map(c=>`<th class="c"><span class="lvtag ${lvc(c)}">${c.lv}</span><span class="unit">Set ${c.set}</span></th>`).join('')}<th class="eb">${CN}人平均得分率</th></tr>`;

  /* ---- 1b. 每位考生卡片 ---- */
  const cards = CANDS.map(c => {
    const row = (name, g, m, cls='') => `<tr${cls?` class="${cls}"`:''}><th>${name}</th><td class="sc2"><b>${g}</b><small>/${m}</small></td><td class="eb">${bar(g/m)}<em>${pc(g/m)}%</em></td></tr>`;
    const lost = ITEMS.map((it,i) => ({it, g:c.m[i]})).filter(o => o.g < o.it.max);
    const miss = ['A1','A2','B'].map(s => {
      const ls = lost.filter(o => o.it.sec===s);
      return ls.length ? `<div class="lsec"><span class="stag s${s}">${s}</span>${ls.map(o=>`<span class="lp ${o.g===0?'z':'p'}" title="${tp(o.it)}">${o.it.code} ${o.g}/${o.it.max}</span>`).join('')}</div>` : '';
    }).join('');
    const r1 = (Object.keys(c.r1).length ? `<p class="remark">設第二次評卷：${Object.entries(c.r1).map(([k,v])=>`${k} M1 ${c.m[ITEMS.findIndex(it=>it.code===k)]}／R1 ${v}${c.r2[k]!==undefined?`／R2 ${c.r2[k]}`:''}`).join('；')}（計分採用 M1）</p>` : '')
      + (c.note ? `<p class="remark">${c.note}</p>` : '');
    return `<div class="qcard dse-card" style="border-top:4px solid ${c.color}">
      <h5><span class="lvtag ${lvc(c)}">${c.label}</span><em>Set ${c.set}</em></h5>
      <p class="big">${c.total}<span>/${SUBJ}　科目得分</span></p>
      <p class="dse-sub">加權卷別得分：卷一 ${c.p1w}　卷二 ${c.p2w}</p>
      <table class="sectab"><thead><tr><th>部分</th><th class="sc2">得分</th><th class="eb">得分率</th></tr></thead><tbody>
        ${row('卷一 A(1)', c.sec.A1, 35)}${row('卷一 A(2)', c.sec.A2, 35)}${row('卷一 B', c.sec.B, 35)}
        ${row('卷一合計', c.p1adj, 105, 'dse-p1')}
        ${row('卷二 MC', c.p2, 45)}
      </tbody></table>
      <p class="dse-lost">卷一失分題目（${lost.length} 項，共失 ${105-c.p1adj} 分）</p>
      ${miss || '<p class="none">全部答對</p>'}${r1}</div>`;
  }).join('');

  /* ---- 1c. 各等級平均及升級差距 ---- */
  const LVORD = [...new Set(CANDS.map(c=>c.lv))];
  const COLS = [['A1',35,c=>c.sec.A1],['A2',35,c=>c.sec.A2],['B',35,c=>c.sec.B],['P1',105,c=>c.p1adj],['MC',45,c=>c.p2],['TOT',SUBJ,c=>c.total]];
  const f1 = v => (Math.round(v*10)/10).toFixed(1).replace(/\.0$/,'');
  let prevAvg = null;
  const lvRows = LVORD.map(l => {
    const g = CANDS.filter(c=>c.lv===l), avgs = COLS.map(([k,m,f]) => g.reduce((t,c)=>t+f(c),0)/g.length);
    const cells = avgs.map((v,i) => {
      const d = prevAvg ? Math.round((v-prevAvg[i])*10)/10 : null;
      const dt = d===null ? '' : `<span class="delta ${d>0?'up':d<0?'dn':'eq'}">${d>0?'+'+f1(d):d<0?'−'+f1(-d):'0'}</span>`;
      return `<td class="c"><b>${f1(v)}</b>${dt}</td>`;
    }).join('');
    prevAvg = avgs;
    return `<tr><th><span class="lvtag ${lvc(g[0])}">Level ${l}</span><small>${g.length} 人（Set ${g.map(c=>c.set).join('、')}）</small></th>${cells}</tr>`;
  }).join('');

  /* ---- 3. 各 Section 常錯題目 ---- */
  function common(s){
    const its = ITEMS.filter(it => it.sec===s).map(it => ({it, g:got(it), full:it.max*CANDS.length, who:lostBy(it)}))
      .filter(o => o.g < o.full).sort((a,b) => (b.full-b.g)-(a.full-a.g) || a.g/a.full-b.g/b.full);
    const totLost = its.reduce((t,o)=>t+o.full-o.g,0);
    const li = its.map(o => {
      const lost = o.full - o.g, rate = o.g/o.full;
      const idx = ITEMS.indexOf(o.it);
      let tag = '';
      const topLv = LVORD[LVORD.length-1], maxI = Math.max(...o.who.map(c => LVORD.indexOf(c.lv)));
      if(o.who.length===CANDS.length) tag = `<span class="ptag comm">${CN}人皆失分</span>`;
      else if(o.who.some(c => c.lv===topLv)) tag = `<span class="ptag comm">${topLv} 亦失分</span>`;
      else if(maxI <= LVORD.length-3) tag = `<span class="ptag pers">只有 Level ${LVORD[maxI]}${maxI>0?' 或以下':''} 失分</span>`;
      const who = o.who.map(c => `<span class="lp ${c.m[idx]===0?'z':'p'}">${c.short} ${c.m[idx]}/${o.it.max}</span>`).join('');
      const lr = lost/o.full, fc = lr>=0.5 ? 'b0' : lr>=0.2 ? 'b1' : 'fl';
      return `<li><span class="bl"><b>${o.it.code}</b> ${tp(o.it)} ${tag}<span class="dse-who">${who}</span></span>
        <span class="bv">失 ${lost}<small>/${o.full} 分</small></span>
        <span class="track"><span class="fill ${fc}" style="width:${100*lr}%"></span></span></li>`;
    }).join('');
    return `<div class="secblock"><h4><span class="dse-h">${SECN[s]}</span><span>${CN}人合共失 ${totLost}／${SECMAX[s]*CANDS.length} 分</span></h4>
      ${li ? `<ul class="bars">${li}</ul>` : `<p class="none">${CN}人全對</p>`}</div>`;
  }

  /* ---- 組合 ---- */
  const LV_ALL = [...new Set(CANDS.map(c=>c.lv))];
  const singles = LV_ALL.filter(l => CANDS.filter(c=>c.lv===l).length===1);
  box.innerHTML = `
  <p class="lede prose">${ds.year} 年 DSE 數學必修部分${CN}份評卷紀錄（Level ${LV_ALL[0]} 至 ${LV_ALL[LV_ALL.length-1]}），逐部分、逐題對照各等級考生的實際得分，作為同學訂立目標的參考。</p>
  ${ds.findings.length ? `<ul class="notes prose">${ds.findings.map(t=>`<li>${t}</li>`).join('')}</ul>` : ''}

  <h3>各 Section 分數比較</h3>
  <p class="caption">考生按科目得分由低至高排列；以得分率比較（各部分滿分不同），縱軸由 ${trendLO}% 起。預設顯示卷一三部分，可按按鈕加入卷二 MC 或隱藏個別部分。</p>
  <div class="dse-toggles" id="dseTog">${trendBtns}</div>
  <div class="scroll"><div class="dse-trendbox" id="dseTrend">${trendSVG()}</div></div>
  <div class="scroll"><table class="tgrid trendtab dse-tt"><thead>${trendHead}</thead><tbody>${trendRows}</tbody></table></div>
  <p class="caption">粗框為該行最高分。</p>

  <h3>各等級平均及升級差距</h3>
  <div class="scroll"><table class="dse-gap"><thead><tr><th>等級</th><th class="c">卷一 A(1)<span class="unit">/35</span></th><th class="c">卷一 A(2)<span class="unit">/35</span></th><th class="c">卷一 B<span class="unit">/35</span></th><th class="c">卷一合計<span class="unit">/105</span></th><th class="c">卷二 MC<span class="unit">/45</span></th><th class="c">科目得分<span class="unit">/${SUBJ}</span></th></tr></thead>
  <tbody>${lvRows}</tbody></table></div>
  <p class="caption">數字為該等級考生的平均分；旁邊的標籤是與上一個等級平均相差的分數。每級人數不多${singles.length?`（${singles.map(l=>'Level '+l).join('、')} 只有一人）`:''}，平均只作參考。</p>

  <h3>各考生分數及失分題目</h3>
  <div class="qcompare dse-cards">${cards}</div>

  <h3>各題得分</h3>
  <div class="filters">
    <label>Section<select id="dseSec"><option value="">全部</option><option value="A1">Section A(1)</option><option value="A2">Section A(2)</option><option value="B">Section B</option></select></label>
    <label>顯示<select id="dseShow"><option value="">全部題目</option><option value="lost">有考生失分</option><option value="all">${CN}人皆失分</option></select></label>
    <label>排序<select id="dseSort"><option value="q">按題號</option><option value="lost">失分最多先</option></select></label>
    <button type="button" id="dseReset">重設</button>
  </div>
  <p class="count" id="dseCount"></p>
  <div class="scroll"><table class="dse-qt"><thead><tr><th>題目</th><th>課題</th><th class="c">滿分</th>
    ${CANDS.map(c=>`<th class="c"><span class="lvtag ${lvc(c)}">${c.lv}</span><span class="mx">Set ${c.set}</span></th>`).join('')}
    <th class="eb">${CN}人得分率</th></tr></thead><tbody id="dseBody"></tbody></table></div>
  <p class="legend"><span><i class="b0"></i>0 分</span><span><i class="b1"></i>未及一半</span><span><i class="b2"></i>一半或以上</span><span><i class="b3"></i>滿分</span><span>R1＝第二次評卷分數（與 M1 不同時才顯示）</span></p>

  <h3>各 Section 常錯題目</h3>
  <p class="caption">只列出有考生失分的題目，按${CN}人合共失分排列。考生標籤：紅色為 0 分，橙色為部分得分；橫條長度為${CN}人合共失分比率。</p>
  <div class="secbars dse-common">${['A1','A2','B'].map(common).join('')}</div>
  <p class="rule-note dse-foot">資料來源：${ds.source}卷一分數採用計入分部基本得分的第一次評卷（M1）；${ds.topicNote}</p>
`;

  /* ---- 2. 各題得分表 ---- */
  function renderQ(){
    const fs = q('dseSec').value, fh = q('dseShow').value, so = q('dseSort').value;
    let shown = 0;
    const html = ['A1','A2','B'].filter(s => !fs || s===fs).map(s => {
      let its = ITEMS.filter(it => it.sec===s).filter(it => {
        const w = lostBy(it).length;
        return fh==='lost' ? w>0 : fh==='all' ? w===CANDS.length : true;
      });
      if(so==='lost') its = its.slice().sort((a,b) => (b.max*N-got(b))-(a.max*N-got(a)) || got(a)/a.max-got(b)/b.max);
      if(!its.length) return '';
      shown += its.length;
      const secAvg = CANDS.reduce((t,c)=>t+c.sec[s],0)/(SECMAX[s]*CANDS.length);
      const head = `<tr class="dse-subrow"><th colspan="3"><span class="stag s${s}">${s}</span> ${SECN[s]} 小計<small>滿分 ${SECMAX[s]}</small></th>
        ${CANDS.map(c=>`<td class="c"><b>${c.sec[s]}</b></td>`).join('')}<td class="eb">${bar(secAvg)}<em>${pc(secAvg)}%</em></td></tr>`;
      const rows = its.map(it => {
        const i = ITEMS.indexOf(it), g = got(it), full = it.max*CANDS.length;
        const cells = CANDS.map(c => {
          const v = c.m[i], r1 = c.r1[it.code], r2 = c.r2[it.code];
          return `<td class="c"><span class="dq ${bin(v/it.max)}">${v}</span>${r1!==undefined?`<small class="r1">R1 ${r1}</small>`:''}${r2!==undefined?`<small class="r1">R2 ${r2}</small>`:''}</td>`;
        }).join('');
        return `<tr><th class="qc">${it.code}</th><td class="tp">${tp(it)}</td><td class="c mx">${it.max}</td>${cells}
          <td class="eb">${bar(g/full)}<em>${pc(g/full)}%</em><small class="il">${g===full?'全對':`失 ${full-g}/${full}`}</small></td></tr>`;
      }).join('');
      return head + rows;
    }).join('');
    q('dseBody').innerHTML = html || `<tr class="empty"><td colspan="${CANDS.length+4}">沒有符合條件的題目，請放寬篩選條件。</td></tr>`;
    q('dseCount').textContent = `顯示 ${shown} 項（共 ${ITEMS.length} 項）`;
  }
  ['dseSec','dseShow','dseSort'].forEach(id => q(id).addEventListener('change', renderQ));
  q('dseReset').addEventListener('click', () => { q('dseSec').value=''; q('dseShow').value=''; q('dseSort').value='q'; renderQ(); });
  renderQ();
  q('dseTog').querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    const k = btn.dataset.k;
    if(trendOn.has(k)){ if(trendOn.size===1) return; trendOn.delete(k); } else trendOn.add(k);
    btn.setAttribute('aria-pressed', trendOn.has(k));
    q('dseTrend').innerHTML = trendSVG();
  }));
}

function mountDSE(app){
  if(!app || app.querySelector('#dse')) return;
  const nos = [...app.querySelectorAll('.secno')].map(e => parseInt(e.textContent,10)).filter(n => !isNaN(n));
  const no = nos.length ? Math.max(...nos) + 1 : null;
  const sec = document.createElement('section');
  sec.id = 'dse';
  sec.innerHTML = `<div class="wrap">
  <h2>${no?`<span class="secno">${no}</span>`:''}DSE 考生報告</h2>
  <div class="dse-years" role="group" aria-label="選擇 DSE 年份">${DSE_SETS.map((d,i)=>`<button type="button" data-y="${d.id}" aria-pressed="${i===0}">DSE ${d.year}<small>${d.CANDS.length} 份紀錄</small></button>`).join('')}</div>
  <div id="dseYear"></div>
  </div>`;
  const all = app.querySelectorAll('section');
  if(all.length) all[all.length-1].after(sec);
  else { const f = app.querySelector('footer'); if(f) f.before(sec); else app.appendChild(sec); }
  const links = app.querySelector('nav .navlinks');
  if(links){
    const a = document.createElement('a'); a.href = '#dse'; a.textContent = 'DSE 考生報告';
    const lock = links.querySelector('.lockbtn'); if(lock) lock.before(a); else links.appendChild(a);
  }
  const jump = app.querySelector('#jump');
  if(jump){ const o = document.createElement('option'); o.value = 'dse'; o.textContent = (no?no+'. ':'') + 'DSE 考生報告'; jump.appendChild(o); }
  const box = sec.querySelector('#dseYear');
  const btns = [...sec.querySelectorAll('.dse-years button')];
  const show = id => {
    btns.forEach(b => b.setAttribute('aria-pressed', b.dataset.y===id));
    dseBuildYear(DSE_SETS.find(d => d.id===id), box);
  };
  btns.forEach(b => b.addEventListener('click', () => show(b.dataset.y)));
  show(DSE_SETS[0].id);
}

  const pw=document.getElementById('pw'), msg=document.getElementById('msg'), go=document.getElementById('go'), eye=document.getElementById('eye');
  eye.addEventListener('click',()=>{const show=pw.type==='password'; pw.type=show?'text':'password'; eye.textContent=show?'隱藏':'顯示'; eye.setAttribute('aria-pressed',String(show)); pw.focus();});
  const hasCrypto = !!(window.crypto && crypto.subtle);
  if(!hasCrypto){ msg.textContent='這個開啟方式不支援解密。請把檔案下載後，用 Chrome、Safari 或 Edge 直接開啟。'; }
  // Accept full-width characters, stray spaces and surrounding brackets
  function candidates(raw){
    let v=(raw.normalize?raw.normalize('NFKC'):raw).replace(/\s+/g,'');
    const list=[v];
    const inner=v.replace(/^[\[【「『(（]+/,'').replace(/[\]】」』)）]+$/,'');
    if(inner && inner!==v) list.push(inner);
    return list;
  }
  async function tryKey(p){
    const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(DATA.salt),iterations:DATA.iter,hash:'SHA-256'}, base, {name:'AES-GCM',length:256}, false, ['decrypt']);
    return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(DATA.iv)}, key, u8(DATA.ct));
  }
  // 解密後的資料以 gzip 壓縮：優先用瀏覽器內建 DecompressionStream，舊瀏覽器改用內嵌 pako
  async function unpack(buf){
    if(DATA.z!==1) return new TextDecoder().decode(buf);
    if(typeof DecompressionStream==='function'){
      try{
        const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new TextDecoder().decode(await new Response(s).arrayBuffer());
      }catch(e){ console.warn('DecompressionStream 失敗，改用 pako', e); }
    }
    if(window.pako && window.pako.ungzip) return new TextDecoder().decode(window.pako.ungzip(new Uint8Array(buf)));
    throw new Error('瀏覽器不支援解壓縮，請改用最新版 Chrome、Edge 或 Safari');
  }
  async function unlock(){
    if(!hasCrypto){ msg.textContent='這個開啟方式不支援解密。請把檔案下載後，用 Chrome、Safari 或 Edge 直接開啟。'; return; }
    if(typeof initReport !== 'function'){ msg.textContent='報告程式未能載入（initReport 不存在），請用較新版本的瀏覽器開啟。'; return; }
    if(!pw.value.trim()){ msg.textContent='請先輸入密碼。'; pw.focus(); return; }
    msg.textContent=''; go.disabled=true; go.textContent='解鎖中…';
    await new Promise(r => setTimeout(r, 30));
    let plain=null; let lastErr=null;
    for(const c of candidates(pw.value)){ try{ plain=await tryKey(c); break; }catch(e){ lastErr=e; } }
    if(!plain){
      const nm = lastErr && lastErr.name ? lastErr.name : '';
      msg.textContent = (nm && nm!=='OperationError') ? ('解密時出錯（'+nm+'：'+(lastErr.message||'')+'）') : '密碼不正確，請再試一次。';
      go.disabled=false; go.textContent='解鎖報告'; pw.select(); return;
    }
    try{
      const p=JSON.parse(await unpack(plain));
      const app=document.getElementById('app'); app.innerHTML=p.html; app.hidden=false;
      if(typeof mountDSE==='function'){ try{ mountDSE(app); }catch(e){ console.error('DSE 考生報告載入失敗', e); } }
      document.getElementById('gate').hidden=true; pw.value='';
      initReport(p.topics);
      if(typeof initQ6==='function'){ try{ initQ6(); }catch(e){ console.error('Quiz 6 面板載入失敗', e); } }
      document.getElementById('lockBtn').addEventListener('click',e=>{
        e.preventDefault(); app.innerHTML=''; app.hidden=true;
        document.getElementById('gate').hidden=false; go.disabled=false; go.textContent='解鎖報告'; msg.textContent=''; pw.focus();
      });
      window.scrollTo(0,0);
    }catch(err){
      msg.textContent='密碼正確，但報告載入時出錯：'+(err && err.message ? err.message : err); go.disabled=false; go.textContent='解鎖報告';
      console.error(err);
    }
  }
  go.addEventListener('click', unlock);
  pw.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); unlock(); } });
  try{ pw.focus(); }catch(e){}
})();
</script>
<script>
/* 卷二 MC：試卷切換；個別學生面板（按 Group A／B 選擇學生）；各 Section 跨年失分題目篩選及排序 */
function initQ6(){
  const sec = document.getElementById('mc'); if(!sec) return;
  /* 試卷切換（全段同步） */
  const sws = [...sec.querySelectorAll('.mcsw button')];
  const setP = p => {
    sws.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === p)));
    sec.querySelectorAll('.mcpp').forEach(d => { d.hidden = d.dataset.p !== p; });
  };
  sws.forEach(b => b.addEventListener('click', () => setP(b.dataset.p)));
  const btns = [...sec.querySelectorAll('.q6bar button')];
  const pans = [...sec.querySelectorAll('#q6Panels .q6p')];
  const DEF = {y:'', paper:'', show:'', sec:'', q:'', sort:'ord'};
  let st = Object.assign({}, DEF), cur = null;
  const ctl = (pan, k) => pan.querySelector('.q6f [data-f="' + k + '"]');
  const SECG = {sA:['A1','A2','MA'], sB:['B','MB']};
  const put = pan => {
    ['y','paper','show','sec','sort'].forEach(k => {
      const el = ctl(pan, k);
      el.value = [...el.options].some(o => o.value === st[k]) ? st[k] : (k === 'sort' ? 'ord' : '');
    });
    ctl(pan, 'q').value = st.q;
  };
  const take = pan => {
    ['y','paper','show','sec','sort'].forEach(k => { st[k] = ctl(pan, k).value; });
    st.q = ctl(pan, 'q').value;
  };
  const render = pan => {
    const kw = st.q.trim().toLowerCase();
    let shown = 0, hidden = 0;
    pan.querySelectorAll('.q6ws').forEach(blk => {
      const tb = blk.querySelector('tbody');
      const trs = [...tb.querySelectorAll('tr[data-y]')];
      let vis = 0;
      trs.forEach(tr => {
        const d = tr.dataset;
        let ok = true;
        if(st.y && d.y !== st.y) ok = false;
        if(st.paper && d.paper !== st.paper) ok = false;
        if(st.sec && (SECG[st.sec] ? !SECG[st.sec].includes(d.sec) : d.sec !== st.sec)) ok = false;
        if(st.show && d[st.show] !== '1') ok = false;
        if(kw && !d.kw.includes(kw)) ok = false;
        tr.hidden = !ok;
        if(ok){ vis++; shown++; } else hidden++;
      });
      const key = tr => {
        const d = tr.dataset, hk = d.hk === undefined ? null : +d.hk, cls = +d.cls;
        switch(st.sort){
          case 'hk-desc': return -(hk === null ? cls : hk);
          case 'hk-asc': return (hk === null ? cls : hk);
          case 'cls-desc': return -cls;
          case 'cls-asc': return cls;
          case 'lost': return -(+d.lost);
          case 'dq': return +d.dq;
          default: return +d.ord;
        }
      };
      trs.sort((a, b) => key(a) - key(b) || (+a.dataset.ord) - (+b.dataset.ord)).forEach(tr => tb.appendChild(tr));
      const nil = tb.querySelector('.q6nil');
      const filtering = st.y || st.paper || st.sec || st.show || kw;
      blk.hidden = filtering ? vis === 0 : false;
      if(nil) nil.hidden = !!filtering;
    });
    pan.querySelector('.q6none').hidden = shown > 0;
    pan.querySelector('.q6count').textContent = '顯示 ' + shown + ' 題' + (hidden ? '，已隱藏 ' + hidden + ' 題' : '');
    pan.querySelectorAll('.q6mx .mxb').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.y === st.y && b.dataset.sec === st.sec)));
  };
  pans.forEach(pan => {
    const f = pan.querySelector('.q6f'); if(!f) return;
    f.querySelectorAll('select').forEach(el => el.addEventListener('change', () => { take(pan); render(pan); }));
    ctl(pan, 'q').addEventListener('input', () => { take(pan); render(pan); });
    ctl(pan, 'reset').addEventListener('click', () => { st = Object.assign({}, DEF); put(pan); render(pan); });
    pan.querySelectorAll('.q6mx .mxb').forEach(b => b.addEventListener('click', () => {
      const same = st.y === b.dataset.y && st.sec === b.dataset.sec;
      st = Object.assign({}, DEF, same ? {sort:st.sort} : {y:b.dataset.y, sec:b.dataset.sec, sort:st.sort});
      put(pan); render(pan);
    }));
  });
  const show = k => {
    btns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
    pans.forEach(p => { p.hidden = p.dataset.k !== k; if(!p.hidden){ cur = p; } });
    if(cur && cur.querySelector('.q6f')){ put(cur); render(cur); }
  };
  btns.forEach(b => b.addEventListener('click', () => show(b.dataset.k)));
  if(btns.length) show(btns[0].dataset.k);
}
</script>
